name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependency
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Check Python imports and syntax
        run: |
          python -m py_compile \
            server.py system_metrics.py cleanup.py cleanup_policy.py \
            companion/*.py tests/*.py
          python -c "import cleanup_policy, cleanup, system_metrics, server"

      - name: Check shell scripts
        run: bash -n scripts/*.sh

      - name: Check extension and frontend
        run: |
          python -m json.tool chrome-extension/manifest.json >/dev/null
          node --check chrome-extension/popup.js
          node --check chrome-extension/service-worker.js
          node --check dist/app.js
